<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎲 サイコロ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f5f0eb;color:#333;user-select:none}

.dice{width:120px;height:120px;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.12);display:grid;padding:20px;cursor:pointer;transition:transform .1s}
.dice:active{transform:scale(.95)}
.dice.rolling{animation:shake .4s ease-in-out}

.dot{width:20px;height:20px;background:#333;border-radius:50%;align-self:center;justify-self:center}

.face-1{grid-template:1fr/1fr}.face-1 .dot{grid-area:1/1}
.face-2{grid-template:1fr 1fr/1fr 1fr}.face-2 .d1{grid-area:1/2}.face-2 .d2{grid-area:2/1}
.face-3{grid-template:1fr 1fr 1fr/1fr 1fr 1fr}.face-3 .d1{grid-area:1/3}.face-3 .d2{grid-area:2/2}.face-3 .d3{grid-area:3/1}
.face-4{grid-template:1fr 1fr/1fr 1fr}
.face-5{grid-template:1fr 1fr 1fr/1fr 1fr 1fr}.face-5 .d1{grid-area:1/1}.face-5 .d2{grid-area:1/3}.face-5 .d3{grid-area:2/2}.face-5 .d4{grid-area:3/1}.face-5 .d5{grid-area:3/3}
.face-6{grid-template:1fr 1fr 1fr/1fr 1fr}

button{margin-top:32px;padding:14px 48px;font-size:18px;font-weight:600;background:#333;color:#fff;border:none;border-radius:12px;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:#555}
button:active{transform:scale(.96)}

@keyframes shake{
  0%,100%{transform:rotate(0)}
  20%{transform:rotate(-12deg) scale(1.1)}
  40%{transform:rotate(10deg)}
  60%{transform:rotate(-6deg)}
  80%{transform:rotate(3deg)}
}
</style>
</head>
<body>

<div class="dice face-1" id="dice">
  <div class="dot"></div>
</div>
<button id="roll">振る</button>

<script>
const dice = document.getElementById('dice');
const btn = document.getElementById('roll');

const faces = {
  1: '<div class="dot"></div>',
  2: '<div class="dot d1"></div><div class="dot d2"></div>',
  3: '<div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div>',
  4: '<div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>',
  5: '<div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div><div class="dot d5"></div>',
  6: '<div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>'
};

function roll() {
  dice.classList.add('rolling');
  btn.disabled = true;
  const n = Math.floor(Math.random() * 6) + 1;
  setTimeout(() => {
    dice.className = 'dice face-' + n;
    dice.innerHTML = faces[n];
  }, 200);
  setTimeout(() => {
    btn.disabled = false;
  }, 400);
}

btn.addEventListener('click', roll);
dice.addEventListener('click', roll);
</script>
</body>
</html>
